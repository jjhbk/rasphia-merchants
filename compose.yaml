services:
  postgres:
    image: postgres:16-alpine
    container_name: rasphia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rasphia
      POSTGRES_PASSWORD: rasphia_local_dev_password
      POSTGRES_DB: rasphia
    ports:
      - "5432:5432"
    volumes:
      - rasphia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasphia -d rasphia"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rasphia_postgres_data:
